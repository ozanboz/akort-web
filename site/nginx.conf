server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Pages are edited by hand and their names are registered with the app
  # stores, so they are served as-is with no rewriting. A miss is a real 404,
  # not a silent fallback to the home page: a store reviewer following a dead
  # privacy link must see the failure, not a page that looks fine.
  location / {
    try_files $uri $uri/ =404;
  }

  # Filenames here are stable rather than hashed, so a long cache would pin an
  # old screenshot after a redesign. An hour is enough to spare the origin
  # without outliving a deploy.
  location /assets/ {
    expires 1h;
    add_header Cache-Control "public";
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css text/html application/javascript image/svg+xml;
  gzip_min_length 1024;
}
